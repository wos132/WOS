<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Historia</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1a1a;
      font-family: system-ui, -apple-system, sans-serif;
      color: #fff;
      padding: 20px;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      width: 100%;
      max-width: 90vw;
    }

    #image-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      max-width: 100%;
      max-height: 70vh;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      background: #000;
    }

    #main-image {
      display: block;
      max-width: 100%;
      max-height: 70vh;
      width: auto;
      height: auto;
      object-fit: contain;
      cursor: pointer;
    }

    /* Fullscreen */
    #image-wrapper:fullscreen,
    #image-wrapper:-webkit-full-screen {
      width: 100%;
      height: 100%;
      max-width: none;
      max-height: none;
      border-radius: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    #image-wrapper:fullscreen #main-image,
    #image-wrapper:-webkit-full-screen #main-image {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
    }

    .controls {
      display: flex;
      justify-content: center;
    }

    button {
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      background: #3b82f6;
      color: #fff;
    }

    button:hover {
      background: #2563eb;
    }

    button:active {
      transform: scale(0.97);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .hint {
      font-size: 14px;
      color: #888;
      text-align: center;
    }

    .error {
      color: #f87171;
      padding: 20px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="image-wrapper">
      <img id="main-image" src="Historia.jpg" alt="Historia" onerror="showError()">
    </div>

    <div class="controls">
      <button id="fullscreen-btn" onclick="toggleFullscreen()">Pełny ekran</button>
    </div>

    <p class="hint">Kliknij obrazek lub przycisk, aby włączyć/wyłączyć pełny ekran.<br>Esc — wyjście z pełnego ekranu.</p>
  </div>

  <script>
    const wrapper = document.getElementById('image-wrapper');
    const btn = document.getElementById('fullscreen-btn');
    const img = document.getElementById('main-image');

    function showError() {
      wrapper.innerHTML = '<p class="error">Nie znaleziono pliku <strong>Historia.png</strong>.<br>Umieść obrazek w tym samym folderze co index.html.</p>';
      btn.disabled = true;
    }

    function isFullscreen() {
      return !!(document.fullscreenElement || document.webkitFullscreenElement);
    }

    function updateButton() {
      btn.textContent = isFullscreen() ? 'Wyjdź z pełnego ekranu' : 'Pełny ekran';
    }

    async function toggleFullscreen() {
      try {
        if (!isFullscreen()) {
          if (wrapper.requestFullscreen) {
            await wrapper.requestFullscreen();
          } else if (wrapper.webkitRequestFullscreen) {
            await wrapper.webkitRequestFullscreen();
          }
        } else {
          if (document.exitFullscreen) {
            await document.exitFullscreen();
          } else if (document.webkitExitFullscreen) {
            await document.webkitExitFullscreen();
          }
        }
      } catch (err) {
        console.error('Fullscreen error:', err);
      }
      updateButton();
    }

    img.addEventListener('click', toggleFullscreen);
    document.addEventListener('fullscreenchange', updateButton);
    document.addEventListener('webkitfullscreenchange', updateButton);
  </script>
</body>
</html>
